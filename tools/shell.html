<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Callover — find your matters in today's cause list</title>
<meta name="description" content="Match a court cause list against your chamber's advocates and case register. Runs entirely in your browser. Nothing is uploaded.">
<!--
  Callover. MIT. https://github.com/rootanand/Callover
  Built by tools/build.mjs from tools/shell.html + src/*.js + vendor/*.
  Do not edit this file by hand — your changes will be overwritten.

  There is deliberately no external resource of any kind in this document.
  No stylesheet link, no font request, no script src, no image URL, no
  analytics. Test T10-01 fails the build if one appears. The only http(s)
  strings you will find are the court portal deep links the user clicks and
  the publisher credit in the footer, both of which are plain <a href> and
  open in a new tab. See TDD.md §8.1a.
-->
<style>
/* ==========================================================================
   Palette — TDD §8.1, shared with The Forensic Brief so the family
   resemblance is deliberate.
   ========================================================================== */
:root{
  --cream:#F4F1E8; --ink:#23211E; --ink2:#4A4740; --muted:#6E6A62; --faint:#94908A;
  --red:#8A2B2B; --red-t:#F5E9E6; --green:#2F6B4F; --green-t:#E6F0E9;
  --amber:#9A6B10; --amber-t:#FAF0DA; --rule:#DDD8CA; --rule2:#EBE7DB;
  --panel:#FFFDF8; --kraft:#B8874A;

  /* Fonts are system stacks, not web fonts. A single external font request
     would make the privacy band a lie (§8.1a, T10-02), and vendoring four
     weights of three families would add well over a megabyte to a file that
     has to be openable by double-click. */
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px 40px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.2;font-weight:600}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--kraft);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- app bar ---------- */
.appbar{background:var(--panel);border-bottom:2px solid var(--ink);padding:13px 0;position:sticky;top:0;z-index:30}
.appbar .in{max-width:1120px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-weight:700;letter-spacing:.05em;line-height:1;color:var(--ink)}
.wordmark .big{font-size:29px} .wordmark .sm{font-size:20px}
.wordmark small{display:block;font-family:var(--body);font-size:11.5px;font-weight:400;color:var(--muted);
  letter-spacing:0;margin-top:4px}
.spacer{flex:1}
.datefield{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:3px;
  padding:7px 12px;background:var(--panel);font-family:var(--mono);font-size:14px;min-height:44px}
.datefield input{border:none;background:none;font:inherit;color:inherit;padding:0}
.offline{font-family:var(--mono);font-size:11px;color:var(--green);background:var(--green-t);
  border:1px solid #C9DED2;border-radius:12px;padding:3px 11px;white-space:nowrap}

.btn{font-family:var(--body);font-size:15px;font-weight:600;border-radius:3px;padding:10px 22px;
  border:1.5px solid var(--ink);background:var(--panel);cursor:pointer;color:var(--ink);min-height:44px}
.btn.primary{background:var(--red);border-color:var(--red);color:#F4F1E8}
.btn.ghost{border-color:var(--rule);color:var(--ink2);font-weight:400}
.btn.sm{padding:6px 15px;font-size:13.5px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:none;background:none;color:var(--red);text-decoration:underline;padding:4px 2px;
  font-weight:400;font-size:13.5px;min-height:0}

/* ---------- steps ---------- */
.step{background:var(--panel);border:1px solid var(--rule);border-radius:3px;margin:18px 0;overflow:hidden}
.step>.hd{display:flex;align-items:center;gap:13px;padding:14px 20px;border-bottom:1px solid var(--rule2);
  background:#FAF7EF;flex-wrap:wrap}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--cream);
  font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;
  justify-content:center;flex:none}
.step .hd h3{font-size:17.5px}
.step .hd .opt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint);
  border:1px solid var(--rule);border-radius:10px;padding:2px 9px}
.step>.bd{padding:18px 20px}
.hint{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.tabsm{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;width:fit-content;margin-bottom:14px}
.tabsm button{border:none;background:var(--panel);padding:10px 16px;font-family:var(--body);font-size:14px;
  cursor:pointer;color:var(--ink2);border-right:1px solid var(--rule);min-height:44px}
.tabsm button:last-child{border-right:none}
.tabsm button.on{background:var(--ink);color:var(--cream);font-weight:600}
textarea{width:100%;min-height:112px;border:1px solid var(--rule);border-radius:3px;padding:11px 13px;
  font-family:var(--mono);font-size:14px;resize:vertical;background:#FAF7EF;color:var(--ink)}
input[type=text],input[type=date],select{font-family:var(--body);font-size:14px;padding:9px 11px;
  border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink);min-height:44px}
.drop{border:2px dashed var(--rule);border-radius:3px;padding:22px;text-align:center;background:#FAF7EF;
  color:var(--muted);font-size:14.5px;cursor:pointer}
.drop.over{border-color:var(--green);background:var(--green-t)}
.drop b{color:var(--ink);font-family:var(--display);font-size:16px;display:block;margin-bottom:3px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:0 10px 8px 0;border-bottom:1.5px solid var(--ink)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule2);vertical-align:top;color:var(--ink2)}
td.k{color:var(--ink);font-weight:600}
.mapped{font-family:var(--mono);font-size:11.5px;color:var(--green);background:var(--green-t);
  border-radius:3px;padding:2px 7px;display:inline-block}
.filerow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule2);
  font-size:14.5px;flex-wrap:wrap}
.filerow .nm{font-family:var(--mono);font-size:13px;flex:1;min-width:180px;word-break:break-all}
.pill{font-family:var(--mono);font-size:10.5px;padding:2px 9px;border-radius:11px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink2);cursor:pointer;
  min-height:44px}
.chk input{width:18px;height:18px;accent-color:var(--green)}
.typesel{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);border-radius:3px;
  padding:6px 9px;background:var(--panel);color:var(--ink);min-height:36px}
.typesel.auto{border-color:var(--green);color:var(--green);background:var(--green-t)}

.links{background:var(--amber-t);border:1px solid #E7D6AE;border-radius:3px;padding:15px 18px;margin:18px 0}
.links h4{font-size:15.5px;color:#6E4C08;margin-bottom:5px}
.links p{font-size:13.5px;color:#5C4207;margin:0 0 11px}
.linkgrid{display:flex;gap:9px;flex-wrap:wrap}
.linkgrid a{font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid #E0CFA9;
  border-radius:3px;padding:9px 12px;color:#6E4C08;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.linkgrid a:after{content:" \2197";opacity:.5}

.runbar{display:flex;gap:14px;align-items:center;margin:24px 0;flex-wrap:wrap}
.prog{background:var(--ink);color:var(--cream);border-radius:3px;padding:16px 20px;margin:18px 0}
.prog .bar{height:5px;background:#3D3A34;border-radius:3px;overflow:hidden;margin:10px 0 9px}
.prog .bar i{display:block;height:5px;width:0;background:var(--kraft);transition:width .2s}
.prog .st{display:flex;gap:22px;font-family:var(--mono);font-size:12px;color:#B5B0A6;flex-wrap:wrap}
.prog .st b{color:var(--cream)}

.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}
@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}}
.sc{border:1px solid var(--rule);border-radius:3px;background:var(--panel);padding:15px 16px}
.sc .v{font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.sc .l{font-size:13px;color:var(--muted);margin-top:3px}
.sc.a{border-left:4px solid var(--green)} .sc.a .v{color:var(--green)}
.sc.r{border-left:4px solid var(--amber)} .sc.r .v{color:var(--amber)}
.sc.w{border-left:4px solid var(--faint)} .sc.w .v{color:var(--muted)}
.sc.f{border-left:4px solid var(--red)}   .sc.f .v{color:var(--red)}
.sc.j{border-left:4px solid var(--ink)}   .sc.j .v{color:var(--ink)}

/* ---------- inline reassurance, at the anxious moments ---------- */
.safe{display:flex;gap:9px;align-items:flex-start;margin-top:13px;padding:11px 14px;
  background:var(--green-t);border-left:3px solid var(--green);border-radius:0 3px 3px 0;
  font-size:13.5px;color:#2A5643;line-height:1.5}
.safe .ic{font-family:var(--mono);font-weight:700;color:var(--green);flex:none}
.safe b{color:#1D3E2F}

.saved{display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--green-t);
  border:1px solid #C9DED2;border-radius:3px;font-size:14px;color:#254F3C;margin-bottom:14px;flex-wrap:wrap}
.saved .ic{font-weight:700;color:var(--green)}
.stale{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--amber-t);
  border:1px solid #E7D6AE;border-radius:3px;font-size:13.5px;color:#5C4207;margin-top:12px;flex-wrap:wrap}
.stale.red{background:var(--red-t);border-color:#E2C3BD;color:#6B2020}
.stale .ic{font-weight:700}
.thorough{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;background:#FAF7EF;
  border:1px solid var(--rule);border-radius:3px;font-size:13.5px;color:var(--ink2);margin-top:13px}
.thorough b{color:var(--ink)}
.banner{padding:13px 18px;border-radius:3px;margin:16px 0;font-size:14.5px;line-height:1.5}
.banner.error{background:var(--red-t);border:1px solid #E2C3BD;color:#6B2020}
.banner.warn{background:var(--amber-t);border:1px solid #E7D6AE;color:#5C4207}
.banner.info{background:var(--green-t);border:1px solid #C9DED2;color:#254F3C}

/* ---------- dual pass ---------- */
.dual{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:18px 20px;margin:18px 0}
.dual h4{font-size:16.5px;margin-bottom:4px}
.dual>p{font-size:13.5px;color:var(--muted);margin:0 0 13px}
.passes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.passes{grid-template-columns:1fr}}
.pass{border-top:2px solid var(--ink);padding-top:10px}
.pass.b{border-top-color:var(--amber)}
.pass .nm{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;color:var(--muted);margin-bottom:4px}
.pass .big{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.pass.b .big{color:var(--amber)}
.pass .d{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.45}
.badpages{margin-top:14px;padding:11px 14px;background:var(--amber-t);border-left:3px solid var(--amber);
  border-radius:0 3px 3px 0;font-size:13.5px;color:#5C4207}
.badpages b{color:#3F2D05}
details{margin-top:10px}
summary{cursor:pointer;font-size:13.5px;color:var(--ink2);padding:8px 0;min-height:44px;display:flex;align-items:center}
.rawtext{font-family:var(--mono);font-size:11.5px;background:#F4F1E8;border:1px solid var(--rule);
  border-radius:3px;padding:10px 12px;white-space:pre-wrap;max-height:280px;overflow:auto;color:var(--ink2)}
.probetable td,.probetable th{font-size:12.5px}

/* ---------- confirm queue ---------- */
.cqhead{display:flex;align-items:baseline;gap:14px;margin:30px 0 4px;flex-wrap:wrap;
  border-top:2px solid var(--ink);padding-top:16px}
.cqhead h2{font-size:26px}
.cqhead .sub{font-size:14.5px;color:var(--muted)}
.cqhead .count{font-family:var(--mono);font-size:11.5px;background:var(--amber);color:#fff;
  border-radius:12px;padding:3px 12px;margin-left:auto}
.card{background:var(--panel);border:1.5px solid var(--amber);border-radius:3px;margin:16px 0;overflow:hidden}
.card.weak{border-color:var(--rule);border-style:dashed}
.card.on{box-shadow:0 0 0 3px rgba(154,107,16,.28)}
.card .q{padding:16px 20px 13px;font-size:19px;font-family:var(--display);font-weight:600;
  border-bottom:1px solid var(--rule2)}
.card .q code{font-family:var(--mono);font-size:17px;background:var(--amber-t);padding:2px 8px;
  border-radius:3px;font-weight:500}
.decisive{background:var(--green);color:#fff;padding:12px 20px;display:flex;align-items:center;
  gap:11px;font-size:15px;flex-wrap:wrap}
.decisive.amber{background:var(--amber)}
.decisive .ic{font-family:var(--mono);font-weight:700;font-size:15px}
.decisive b{font-family:var(--mono)}
.decisive .sub{font-size:13.5px;opacity:.9;width:100%;margin-top:1px}

.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
.cmp thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:12px 16px 8px;border-bottom:1.5px solid var(--ink);
  background:#FAF7EF;text-align:left}
.cmp thead th:first-child{width:118px}
.cmp thead th:last-child{width:112px;text-align:right}
.cmp td{padding:11px 16px;border-bottom:1px solid var(--rule2);vertical-align:top}
.cmp td.f{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding-top:13px}
.cmp td.val{color:var(--ink);line-height:1.45}
.cmp td.reg{color:var(--ink2);line-height:1.45}
.cmp td .m{font-family:var(--mono);font-size:13.5px;word-break:break-word}
.cmp td.v{text-align:right;white-space:nowrap;padding-top:12px}
.vd{font-family:var(--mono);font-size:10px;letter-spacing:.07em;padding:3px 9px;border-radius:11px;
  display:inline-block}
.vd.agree{background:var(--green-t);color:var(--green)}
.vd.differ{background:var(--amber-t);color:var(--amber)}
.vd.absent,.vd.unknown{background:var(--rule2);color:var(--faint)}
.cmp tr.hero td{background:var(--green-t)}
.cmp .note{display:block;font-size:13px;color:var(--muted);margin-top:5px;font-style:italic}
.dim{color:var(--faint)}

/* §8.6 — below 700px the comparison table becomes stacked pairs. Never a
   horizontal scroll: an advocate on a phone must not have to swipe sideways
   to see the register column. */
@media(max-width:700px){
  .cmp thead{display:none}
  .cmp,.cmp tbody,.cmp tr,.cmp td{display:block;width:100%}
  .cmp tr{border-bottom:1px solid var(--rule);padding:10px 0}
  .cmp td{border:none;padding:3px 16px}
  .cmp td.f{padding-top:8px}
  .cmp td.reg:before{content:"In your register: ";font-family:var(--mono);font-size:10px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
  .cmp td.v{text-align:left;padding-bottom:8px}
}

.colleague{padding:12px 20px;background:#FAF7EF;border-bottom:1px solid var(--rule2);font-size:14.5px;
  color:var(--ink2);display:flex;gap:11px;align-items:flex-start}
.colleague .ic{color:var(--green);font-weight:700}
.colleague b{color:var(--ink);font-family:var(--mono);font-size:13.5px}
.colleague.warn{background:var(--amber-t);color:#5C4207}
.colleague.warn .ic{color:var(--amber)}
.excerpt{padding:14px 20px;border-bottom:1px solid var(--rule2)}
.excerpt pre{font-family:var(--mono);font-size:12px;background:#F4F1E8;border:1px solid var(--rule);
  border-radius:3px;padding:12px 14px;white-space:pre-wrap;overflow-x:auto;line-height:1.65;margin:6px 0 0;
  color:var(--ink2);word-break:break-word}
.excerpt mark{background:#F0DCA4;color:var(--ink);padding:1px 3px;font-weight:600}
.cardfoot{display:flex;align-items:center;gap:14px;padding:13px 20px;flex-wrap:wrap;background:#FAF7EF}
.prov{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.acts{margin-left:auto;display:flex;gap:9px}
.yes{background:var(--green);border-color:var(--green);color:#fff}
.no{background:var(--panel);border-color:var(--rule);color:var(--ink2)}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid rgba(255,255,255,.4);border-radius:2px;
  padding:1px 4px;margin-left:6px}
.no .kbd{border-color:var(--rule);color:var(--faint)}
.decided{padding:13px 20px;font-size:14px;color:var(--muted);background:#FAF7EF}

/* ---------- results ---------- */
.tabs{display:flex;border-bottom:2px solid var(--ink);margin:34px 0 0;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:13px 20px;font-family:var(--display);font-size:16px;
  font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;
  min-height:44px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.advblock{border:1px solid var(--rule);border-radius:3px;background:var(--panel);margin:16px 0;overflow:hidden}
.advblock .ah{background:#FAF7EF;border-bottom:1px solid var(--rule2);padding:12px 18px;display:flex;
  align-items:baseline;gap:12px;flex-wrap:wrap}
.advblock .ah h4{font-size:17px}
.advblock .ah .en{font-family:var(--mono);font-size:12px;color:var(--muted)}
.advblock .ah .ct{font-family:var(--mono);font-size:11.5px;background:var(--ink);color:var(--cream);
  border-radius:11px;padding:2px 10px;margin-left:auto}
.row{padding:13px 18px;border-bottom:1px solid var(--rule2);cursor:pointer;display:grid;
  grid-template-columns:56px 1fr auto;gap:14px;align-items:start;width:100%;text-align:left;
  background:none;border-left:none;border-right:none;border-top:none;font:inherit;color:inherit}
.row:last-child{border-bottom:none}
.row:hover{background:#FAF7EF}
.row .item{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.row .item b{display:block;font-size:17px;color:var(--ink)}
.row .cn{font-family:var(--mono);font-size:14px;font-weight:600;margin-bottom:2px;word-break:break-word}
.row .tt{font-size:14px;color:var(--ink2);line-height:1.4}
.row .loc{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.tier{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:3px 9px;border-radius:11px;
  white-space:nowrap;display:inline-block}
.tier.auto{background:var(--green-t);color:var(--green)}
.tier.review{background:var(--amber-t);color:var(--amber)}
.tier.weak{background:var(--rule2);color:var(--muted)}
.dupe{font-family:var(--mono);font-size:10.5px;color:#7A5A22;background:#F7EEDD;
  border:1px solid #E4D3B2;border-radius:3px;padding:1px 7px;margin-left:7px;display:inline-block}
.dupe.red{color:#6B2020;background:var(--red-t);border-color:#E2C3BD}
.hidden-toggle{text-align:center;padding:14px;font-size:13.5px;color:var(--muted);border:1px dashed var(--rule);
  border-radius:3px;margin:14px 0;cursor:pointer;background:#FAF7EF;width:100%;font-family:inherit;min-height:44px}
.drawer{padding:14px 18px;background:#FAF7EF;border-top:1px solid var(--rule2)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:15px;background:var(--panel);
  border:1px solid var(--rule);border-radius:3px;margin:16px 0}
.empty b{display:block;font-family:var(--display);font-size:19px;color:var(--ink);margin-bottom:6px}

/* ---------- how it works ---------- */
.howsafe{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:22px 24px;margin:26px 0 0}
.howsafe h3{font-size:19px;margin-bottom:5px}
.howsafe>p{font-size:14.5px;color:var(--muted);margin:0 0 16px;max-width:700px}
.howsafe td.q{color:var(--ink);font-weight:600;width:38%}
.howsafe .caveat{margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule);
  font-size:13.5px;color:var(--muted);line-height:1.55}
.howsafe .caveat b{color:var(--ink2)}

.exportbar{display:flex;gap:11px;align-items:center;margin:26px 0 0;padding:16px 18px;border:1px solid var(--rule);
  border-radius:3px;background:var(--panel);flex-wrap:wrap}
.exportbar .lbl{font-family:var(--display);font-size:16px;font-weight:600}
.exportbar .note{font-size:13px;color:var(--muted);margin-left:auto}

/* ---------- privacy band ----------
   TDD §8.1a placement 2. Moved from directly under the app bar to the foot of
   the page, immediately above the footer: the permanent pill in the app bar
   makes the claim, and the full statement with its three specifics and the
   verification invitation sits here where the reader has already seen what the
   tool does. The four placements of §8.1a are unchanged in number and content.
   -------------------------------------------------------------------------- */
.privacy{background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:30px 0 28px;margin-top:34px}
.privacy .in{max-width:1120px;margin:0 auto;padding:0 22px}
.privacy .claim{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.01em;
  display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.privacy .claim .lock{width:19px;height:23px;flex:none}
.privacy .sub{font-size:15.5px;color:var(--muted);margin-top:6px;max-width:760px}
.privacy .specs{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:20px}
@media(max-width:900px){.privacy .specs{grid-template-columns:1fr 1fr;gap:16px}}
@media(max-width:560px){.privacy .specs{grid-template-columns:1fr;gap:14px}}
.privacy .specs div{border-top:2px solid var(--green);padding-top:11px}
.privacy .specs b{display:block;font-family:var(--display);font-size:16px;color:var(--ink);margin-bottom:3px}
.privacy .specs span{font-size:14px;color:var(--ink2);line-height:1.5}
.privacy .verify{margin-top:20px;background:var(--green-t);border:1px solid #C9DED2;border-radius:3px;
  padding:13px 18px;font-size:15px;color:#254F3C;display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.privacy .verify .ic{font-family:var(--mono);font-weight:700;color:var(--green)}
.privacy .verify b{color:#1D3E2F}

/* ---------- footer ---------- */
.sitefoot{background:var(--ink);color:#B5B0A6;padding:44px 22px 32px}
.sitefoot .in{max-width:1120px;margin:0 auto;text-align:center}
.sitefoot .pw{font-family:var(--body);font-size:12px;letter-spacing:.18em;color:#7E7A72;margin-bottom:16px}
.fbmark{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.fbword{font-family:var(--display);color:var(--cream);letter-spacing:.1em;line-height:1}
.fbword .b{font-size:28px} .fbword .s{font-size:19px}
.fbtag{font-family:var(--display);font-style:italic;font-size:13.5px;color:#8A857C;margin-top:8px;letter-spacing:.02em}
.sitefoot .legal{border-top:1px solid #3A3733;margin-top:30px;padding-top:18px;font-size:12.5px;
  color:#6E6A62;display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.sitefoot a{color:#B5B0A6}

/* ---------- settings dialog ---------- */
dialog{border:1px solid var(--ink);border-radius:3px;padding:0;max-width:760px;width:calc(100% - 32px);
  background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(35,33,30,.55)}
dialog .dh{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--rule);
  background:#FAF7EF}
dialog .dh h3{font-size:20px}
dialog .db{padding:20px 22px;max-height:70vh;overflow:auto}
dialog .df{padding:14px 22px;border-top:1px solid var(--rule);display:flex;gap:10px;flex-wrap:wrap}
.setrow{padding:12px 0;border-bottom:1px solid var(--rule2)}
.setrow:last-child{border-bottom:none}
.setrow h4{font-size:15.5px;margin-bottom:3px}
.setrow p{font-size:13.5px;color:var(--muted);margin:0 0 8px}

/* ---------- print ---------- */
@media print{
  .appbar,.step,.links,.runbar,.prog,.exportbar,.privacy,.sitefoot,.hidden-toggle,
  .acts,.dual details,#co-settings{display:none !important}
  body{background:#fff;font-size:11pt}
  .card,.advblock,.summary .sc{break-inside:avoid;border-color:#999}
  .wrap{max-width:none;padding:0}
  a[href]:after{content:""}
}
</style>
</head>
